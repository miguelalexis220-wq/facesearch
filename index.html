<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>FaceSearch</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:#eaf1ff;
 font-family:Arial,sans-serif;padding:22px;
}
header{text-align:center;margin:35px 0}
.logo{font-size:38px;color:#48a9ff}
h1{margin:10px;font-size:30px}
p{color:#8d9bb5}
main{max-width:650px;margin:auto}
.panel{
 background:#101a2b;border:1px solid #243550;
 border-radius:16px;padding:22px;margin:18px 0;
}
.upload{
 border:2px dashed #315b87;border-radius:14px;
 padding:35px 15px;text-align:center;
 cursor:pointer;
}
button{
 background:#1678d3;color:white;border:0;
 padding:14px 20px;border-radius:10px;
 font-weight:bold;cursor:pointer;width:100%;
}
input{display:none}
img{max-width:100%;max-height:300px;border-radius:12px}
#preview{text-align:center;margin:15px}
#results{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{
 background:#17243a;padding:12px;border-radius:12px;
 text-align:center;
}
small{color:#91a3bf}
footer{text-align:center;color:#65748d;margin:35px}
</style>
</head>
<body>
<header>
 <div class="logo">◉</div>
 <h1>FaceSearch</h1>
 <p>Motor de búsqueda visual</p>
</header>

<main>
 <section class="panel">
  <h2>Buscar imágenes</h2>
  <p>Selecciona una fotografía para comenzar.</p>
  <label class="upload" for="photo">
   <div style="font-size:38px">＋</div>
   <strong>Subir fotografía</strong>
   <p>JPG, PNG o WEBP</p>
  </label>
  <input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
  <div id="preview"></div>
  <button id="search" disabled>Buscar imágenes similares</button>
  <p id="status"></p>
 </section>

 <section class="panel">
  <h2>Resultados</h2>
  <div id="results">
   <p>Los resultados aparecerán aquí.</p>
  </div>
 </section>
</main>

<footer>FaceSearch · Versión de prueba 1.0</footer>

<script>
const photo=document.getElementById('photo');
const preview=document.getElementById('preview');
const search=document.getElementById('search');
const status=document.getElementById('status');
const results=document.getElementById('results');
let selected=null;

photo.addEventListener('change',()=>{
 const file=photo.files[0];
 if(!file)return;
 if(!file.type.startsWith('image/')){
  status.textContent='Selecciona una imagen válida.';
  return;
 }
 if(file.size>8*1024*1024){
  status.textContent='La imagen debe pesar menos de 8 MB.';
  return;
 }
 selected=file;
 const url=URL.createObjectURL(file);
 preview.innerHTML='';
 const img=document.createElement('img');
 img.src=url;
 preview.appendChild(img);
 search.disabled=false;
 status.textContent='Imagen cargada correctamente.';
});

search.addEventListener('click',()=>{
 if(!selected)return;
 results.innerHTML='';
 const item=document.createElement('div');
 item.className='result';
 const img=document.createElement('img');
 img.src=URL.createObjectURL(selected);
 const label=document.createElement('small');
 label.textContent='Imagen de referencia';
 item.append(img,label);
 results.appendChild(item);
 status.textContent='Vista previa completada. Motor de búsqueda pendiente de conexión.';
});
</script>
</body>
</html>
